<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duhok Elegancy">
<title>Duhok Elegancy</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--gold:#C9A84C;--gold-light:#E8C96A;--gold-dark:#8B6914;--black:#0A0A0A;--dark:#111111;--dark2:#1A1A1A;--dark3:#222222;--text:#F5EDD6;--text-muted:#9A8660;--border:rgba(201,168,76,0.25);--border-strong:rgba(201,168,76,0.5);}
body{background:var(--black);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;}
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--black);}
.header{background:var(--dark);border-bottom:0.5px solid var(--border-strong);padding:14px 16px 12px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
.logo-circle{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--gold);background:var(--dark2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.header-title{font-family:"Playfair Display",serif;font-size:16px;color:var(--gold-light);font-weight:500;}
.header-sub{font-size:10px;color:var(--text-muted);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#5DCAA5;margin-right:auto;flex-shrink:0;}
.sync-dot.off{background:#EF9F27;}
.sync-dot.err{background:#E05555;}
.rate-bar{background:var(--dark2);border-bottom:0.5px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:10px;}
.rate-info{flex:1;}
.rate-label{font-size:10px;color:var(--text-muted);}
.rate-val{font-size:14px;font-weight:500;color:var(--gold-light);}
.rate-edit-btn{background:none;border:0.5px solid var(--border-strong);border-radius:6px;color:var(--gold);padding:5px 12px;font-size:12px;cursor:pointer;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;display:none;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--dark2);border:0.5px solid var(--border-strong);border-radius:16px;padding:24px;width:320px;max-width:90vw;}
.modal-title{font-family:"Playfair Display",serif;font-size:16px;color:var(--gold-light);margin-bottom:12px;}
.modal-note{font-size:12px;color:var(--text-muted);margin-bottom:12px;line-height:1.6;}
.modal-row{display:flex;gap:8px;margin-top:12px;}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--dark);border-top:0.5px solid var(--border-strong);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0);}
.nav-item{flex:1;padding:10px 4px 12px;text-align:center;cursor:pointer;border:none;background:none;color:var(--text-muted);font-size:10px;}
.nav-item i{display:block;font-size:22px;margin-bottom:2px;}
.nav-item.active{color:var(--gold);}
.nav-item.active i{color:var(--gold-light);}
.section{display:none;padding:14px 16px 100px;}
.section.active{display:block;}
.card{background:var(--dark2);border:0.5px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
.card-title{font-size:13px;color:var(--gold);font-weight:500;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.ctype-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px;}
.ctype{padding:12px 8px;border:0.5px solid var(--border);border-radius:12px;cursor:pointer;text-align:center;color:var(--text-muted);font-size:13px;background:var(--dark3);}
.ctype.selected{border-color:var(--gold);color:var(--gold-light);background:rgba(201,168,76,0.08);}
.ctype i{display:block;font-size:22px;margin-bottom:4px;}
label{font-size:11px;color:var(--text-muted);display:block;margin-bottom:4px;margin-top:12px;}
label:first-child{margin-top:0;}
input,select,textarea{width:100%;background:var(--dark3);border:0.5px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font-size:14px;font-family:inherit;-webkit-appearance:none;}
input::placeholder{color:var(--text-muted);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);}
select option{background:var(--dark3);color:var(--text);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.search-results{background:var(--dark3);border:0.5px solid var(--border-strong);border-radius:8px;margin-top:4px;display:none;max-height:200px;overflow-y:auto;}
.search-item{padding:10px 12px;font-size:13px;cursor:pointer;border-bottom:0.5px solid var(--border);}
.search-item:last-child{border-bottom:none;}
.search-item:active{background:rgba(201,168,76,0.08);}
.search-item strong{color:var(--gold-light);}
.search-item span{font-size:11px;color:var(--text-muted);}
.filled-info{background:rgba(201,168,76,0.06);border:0.5px solid var(--border-strong);border-radius:8px;padding:10px 12px;margin-top:8px;display:none;}
.fi-row{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;}
.fi-label{color:var(--text-muted);}
.fi-val{color:var(--gold-light);font-weight:500;}
.price-result{background:rgba(201,168,76,0.06);border:0.5px solid var(--border-strong);border-radius:12px;padding:14px 16px;margin-top:12px;display:none;}
.price-big{font-family:"Playfair Display",serif;font-size:32px;font-weight:600;color:var(--gold-light);letter-spacing:1px;}
.price-break{font-size:11px;color:var(--text-muted);margin-top:4px;}
.btn-gold{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold-dark),var(--gold),var(--gold-dark));border:none;border-radius:12px;color:var(--black);font-size:15px;font-weight:600;cursor:pointer;font-family:"Playfair Display",serif;letter-spacing:0.5px;}
.btn-outline{padding:8px 16px;background:none;border:0.5px solid var(--border-strong);border-radius:8px;color:var(--gold);font-size:13px;cursor:pointer;}
.btn-ghost{background:none;border:none;color:var(--gold);font-size:12px;cursor:pointer;padding:4px;}
.success-banner{background:rgba(201,168,76,0.08);border:0.5px solid var(--border-strong);border-radius:12px;padding:16px;margin-bottom:12px;display:none;}
.success-title{font-family:"Playfair Display",serif;color:var(--gold-light);font-size:15px;margin-bottom:10px;}
.success-btns{display:flex;gap:8px;}
.success-btns button{flex:1;padding:10px;border-radius:10px;font-size:12px;cursor:pointer;border:0.5px solid var(--border-strong);background:none;color:var(--gold);}
.success-btns .btn-same{background:rgba(201,168,76,0.12);}
.order-card{background:var(--dark2);border:0.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.order-name{font-size:14px;font-weight:500;color:var(--gold-light);}
.order-meta{font-size:11px;color:var(--text-muted);margin-top:2px;}
.order-price{font-family:"Playfair Display",serif;font-size:15px;color:var(--gold);}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;margin-top:5px;}
.b-pending{background:rgba(186,117,23,0.2);color:#EF9F27;}
.b-confirmed{background:rgba(15,110,86,0.2);color:#5DCAA5;}
.b-shipped{background:rgba(55,138,221,0.15);color:#85B7EB;}
.b-delivered{background:rgba(99,153,34,0.2);color:#97C459;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat{background:var(--dark2);border:0.5px solid var(--border);border-radius:12px;padding:12px;}
.stat-label{font-size:10px;color:var(--text-muted);margin-bottom:4px;}
.stat-val{font-family:"Playfair Display",serif;font-size:18px;color:var(--gold-light);}
.cust-card{background:var(--dark2);border:0.5px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.avatar{width:36px;height:36px;border-radius:50%;border:1px solid var(--gold);background:rgba(201,168,76,0.1);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:var(--gold);flex-shrink:0;}
.filter-row{display:flex;gap:8px;margin-bottom:12px;}
.filter-row input{flex:1;}
.filter-row select{width:120px;}
.history-panel{background:var(--dark3);border:0.5px solid var(--border-strong);border-radius:10px;padding:10px;margin-top:8px;display:none;}
.history-item{font-size:12px;color:var(--text-muted);padding:5px 0;border-bottom:0.5px solid var(--border);display:flex;justify-content:space-between;}
.history-item:last-child{border-bottom:none;}
.empty{text-align:center;color:var(--text-muted);padding:32px 16px;font-size:14px;}
.empty i{font-size:36px;display:block;margin-bottom:8px;color:var(--gold-dark);}
.loading{text-align:center;padding:20px;color:var(--text-muted);font-size:13px;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo-circle">&#x265B;</div>
    <div>
      <div class="header-title">Duhok Elegancy</div>
      <div class="header-sub" id="sync-label">جاري الاتصال...</div>
    </div>
    <div class="sync-dot off" id="sync-dot"></div>
  </div>

  <div class="rate-bar">
    <div class="rate-info">
      <div class="rate-label">سعر الصرف - سوق دهوك</div>
      <div class="rate-val" id="rate-display">-</div>
    </div>
    <button class="rate-edit-btn" onclick="openRateModal()"><i class="ti ti-edit"></i> تعديل</button>
  </div>

  <div class="modal-overlay" id="rate-modal">
    <div class="modal">
      <div class="modal-title">&#x265B; تحديث سعر الصرف</div>
      <div class="modal-note">أدخل سعر <strong style="color:var(--gold-light)">الدولار</strong> بالدينار وسعره بالليرة حسب سوق دهوك الحالي.</div>
      <div class="row2">
        <div><label>1$ = كم دينار؟</label><input type="number" id="usd-iqd-inp" placeholder="1490" oninput="prevRate()"></div>
        <div><label>1$ = كم ليرة؟</label><input type="number" id="usd-try-inp" placeholder="34" oninput="prevRate()"></div>
      </div>
      <div id="rate-prev" style="font-size:13px;color:var(--gold-light);min-height:20px;margin-top:8px;"></div>
      <div class="modal-row">
        <button class="btn-outline" onclick="closeRateModal()" style="flex:1">إلغاء</button>
        <button class="btn-gold" onclick="saveRate()" style="flex:2">حفظ</button>
      </div>
    </div>
  </div>

  <div id="sec-order" class="section active">
    <div class="success-banner" id="suc-banner">
      <div class="success-title">&#x2713; تم حفظ الطلبية!</div>
      <div class="success-btns">
        <button class="btn-same" onclick="sameCust()"><i class="ti ti-user-check"></i><br>طلبية أخرى<br>لنفس العميل</button>
        <button onclick="freshOrder()"><i class="ti ti-plus"></i><br>طلبية جديدة<br>لعميل آخر</button>
      </div>
    </div>
    <div id="order-form">
      <div class="card">
        <div class="card-title"><i class="ti ti-user"></i>نوع العميل</div>
        <div class="ctype-grid">
          <div class="ctype selected" id="ctype-old" onclick="selType('old')"><i class="ti ti-user-check"></i>عميل قديم</div>
          <div class="ctype" id="ctype-new" onclick="selType('new')"><i class="ti ti-user-plus"></i>عميل جديد</div>
        </div>
        <div id="old-sec">
          <label>ابحث بالاسم أو الإنستقرام</label>
          <input type="search" id="search-inp" placeholder="اكتب للبحث..." oninput="doSearch(this.value)" autocomplete="off">
          <div class="search-results" id="search-res"></div>
          <div class="filled-info" id="fi">
            <div class="fi-row">
              <div><span class="fi-label">الاسم </span><span class="fi-val" id="fi-name"></span></div>
              <div><span class="fi-label">انستقرام </span><span class="fi-val" id="fi-ig"></span></div>
              <div><span class="fi-label">هاتف </span><span class="fi-val" id="fi-ph"></span></div>
              <div><span class="fi-label">مكان </span><span class="fi-val" id="fi-loc"></span></div>
            </div>
            <div id="hist-toggle" style="margin-top:8px;display:none">
              <button class="btn-ghost" onclick="toggleHist()"><i class="ti ti-history"></i> <span id="hist-lbl">الطلبيات السابقة</span></button>
              <div class="history-panel" id="hist-panel"></div>
            </div>
          </div>
        </div>
        <div id="new-sec" style="display:none">
          <div class="row2">
            <div><label>الاسم</label><input id="nc-name" placeholder="الاسم الكامل"></div>
            <div><label>انستقرام</label><input id="nc-ig" placeholder="@username"></div>
          </div>
          <div class="row2">
            <div><label>هاتف</label><input id="nc-ph" placeholder="07..." type="tel"></div>
            <div><label>مكان</label><input id="nc-loc" placeholder="دهوك / زاخو..."></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title"><i class="ti ti-shopping-bag"></i>تفاصيل المنتج</div>
        <label>اسم / وصف المنتج</label>
        <input id="prod-name" placeholder="مثال: فستان، طاولة...">
        <label>رابط المنتج - اختياري</label>
        <input id="prod-link" placeholder="https://www.trendyol.com/..." type="url">
        <label>اسم البراند - اختياري</label>
        <input id="prod-brand" placeholder="مثال: Zara، LC Waikiki، DeFacto..." oninput="filterBrands(this.value)" autocomplete="off">
        <label>العدد / الكمية</label>
        <input id="prod-qty" type="number" placeholder="1" min="1" value="1">
        <div id="brand-suggestions" style="background:var(--dark3);border:0.5px solid var(--border-strong);border-radius:8px;margin-top:4px;display:none;max-height:160px;overflow-y:auto;"></div>
        <div class="row2" style="margin-top:12px">
          <div><label>سعر الليرة (TL)</label><input id="price-tl" type="number" placeholder="0" oninput="calc()"></div>
          <div><label>هامش الربح (IQD)</label><input id="profit" type="number" placeholder="" oninput="calc()"></div>
        </div>
        <div id="usd-preview" style="display:none;font-size:12px;color:var(--text-muted);margin-top:6px">
          السعر بالدولار: <span id="price-usd" style="color:var(--gold-light);font-weight:500"></span>
        </div>
        <label>ملاحظة الربح - اختياري</label>
        <input id="profit-note" placeholder="مثال: ثقيل - شحن إضافي">
        <div class="price-result" id="price-box">
          <div style="font-size:11px;color:var(--text-muted)">السعر النهائي بالدينار</div>
          <div class="price-big" id="price-iqd">-</div>
          <div class="price-break" id="price-break"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title"><i class="ti ti-clipboard-list"></i>حالة الطلبية</div>
        <select id="o-status">
          <option value="pending">قيد الانتظار</option>
          <option value="confirmed">مؤكدة</option>
          <option value="shipped">مشحونة</option>
          <option value="delivered">مسلمة</option>
        </select>
        <label>ملاحظات - اختياري</label>
        <textarea id="o-notes" rows="2" placeholder="أي ملاحظات..."></textarea>
      </div>
      <button class="btn-gold" onclick="saveOrder()">&#x265B; حفظ الطلبية</button>
      <div style="height:8px"></div>
    </div>
  </div>

  <div id="sec-orders" class="section">
    <div class="stat-grid" id="stats"></div>
    <div class="filter-row">
      <input id="o-search" placeholder="بحث بالاسم..." oninput="renderOrders()">
      <select id="o-filter" onchange="renderOrders()">
        <option value="">الكل</option>
        <option value="pending">انتظار</option>
        <option value="confirmed">مؤكدة</option>
        <option value="shipped">مشحونة</option>
        <option value="delivered">مسلمة</option>
      </select>
    </div>
    <button class="btn-outline" onclick="exportXL()" style="margin-bottom:12px;width:100%"><i class="ti ti-download"></i> تحميل Excel</button>
    <div id="orders-list"><div class="loading">جاري التحميل...</div></div>
  </div>

  <div id="sec-customers" class="section">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <span style="font-size:13px;color:var(--text-muted)" id="cust-count">0 عميل</span>
      <label class="btn-outline" style="cursor:pointer"><i class="ti ti-upload"></i> رفع Excel
        <input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="importXL(this)">
      </label>
    </div>
    <div id="cust-list"></div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" id="nav-order" onclick="showSec('order')"><i class="ti ti-plus"></i>طلبية</button>
    <button class="nav-item" id="nav-orders" onclick="showSec('orders')"><i class="ti ti-list"></i>الطلبيات</button>
    <button class="nav-item" id="nav-customers" onclick="showSec('customers')"><i class="ti ti-users"></i>العملاء</button>
  </nav>
</div>

  // Save rate to Firestore so all devices get it
  try{ await setDoc(doc(db,'settings','rate'), {iqd:i, try:t, updated: new Date().toISOString()}); } catch(e){}
  updateRateDisplay(); closeRateModal(); calc();
}

// --- Listen to rate changes from other devices ---
onSnapshot(doc(db,'settings','rate'), (snap) => {
  if(snap.exists()){
    const d = snap.data();
    rateIQD = d.iqd; rateTRY = d.try;
    localStorage.setItem('de_iqd', rateIQD); localStorage.setItem('de_try', rateTRY);
    updateRateDisplay(); calc();
  }
});

onSnapshot(ordersQ, (snap) => {

// --- Calc ---
window.calc = function(){
  const tl=parseFloat(document.getElementById('price-tl').value)||0;
  const pr=parseFloat(document.getElementById('profit').value)||0;
  const box=document.getElementById('price-box'); const r=getR();
  if(!tl||!r){box.style.display='none';document.getElementById('usd-preview').style.display='none';return;}
  const base=tl*r; const total=base+pr;
  box.style.display='block';
  document.getElementById('price-iqd').textContent=Math.round(total).toLocaleString('en-US')+' IQD';
  document.getElementById('price-break').textContent='تحويل: '+Math.round(base).toLocaleString('en-US')+(pr?' + ربح: '+Math.round(pr).toLocaleString('en-US'):'');
  // USD price
  if(rateIQD){
    const usd = total / rateIQD;
    document.getElementById('price-usd').textContent = '$'+usd.toFixed(2);
    document.getElementById('usd-preview').style.display='block';
  }
}

// --- Search ---
window.doSearch = function(q){
  const el=document.getElementById('search-res');

  const m=customers.filter(c=>(c.name||'').toLowerCase().includes(q.toLowerCase())||(c.ig||'').toLowerCase().includes(q.toLowerCase())||(c.phone||'').includes(q)).slice(0,10);

  el.style.display='block';

window.pickCust = function(i){

// --- Save order to Firestore ---
window.saveOrder = async function(){
  const r=getR(); if(!r){openRateModal();return;}
  let cust;
  if(ctype==='old'){if(!selCust){alert('اختر عميل من القائمة');return;}cust=selCust;}
  else{
    const n=document.getElementById('nc-name').value.trim();
    if(!n){alert('ادخل اسم العميل');return;}
    cust={name:n,ig:document.getElementById('nc-ig').value.trim(),phone:document.getElementById('nc-ph').value.trim(),location:document.getElementById('nc-loc').value.trim()};
    if(!customers.find(c=>c.name===cust.name&&c.phone===cust.phone)){customers.push(cust);localStorage.setItem('de_c',JSON.stringify(customers));}
  }
  const tl=parseFloat(document.getElementById('price-tl').value)||0;
  if(!tl){alert('ادخل سعر الليرة');return;}
  const pr=parseFloat(document.getElementById('profit').value)||0;
  const iqd=Math.round(tl*r+pr);
  const order={
    date: new Date().toLocaleDateString('ar-IQ'),
    createdAt: Date.now(),
    customer: cust,
    priceTL: tl, profit: pr,
    profitNote: document.getElementById('profit-note').value.trim(),
    priceIQD: iqd,
    brand: document.getElementById('prod-brand').value.trim(),
    qty: parseInt(document.getElementById('prod-qty').value)||1,
    product: document.getElementById('prod-name').value.trim(),
    link: document.getElementById('prod-link').value.trim(),
    status: document.getElementById('o-status').value,
    notes: document.getElementById('o-notes').value.trim(),
    rate: r
  };
  try{
    await addDoc(collection(db,'orders'), order);
    lastCust=cust;
    document.getElementById('order-form').style.display='none';
    document.getElementById('suc-banner').style.display='block';
    window.scrollTo(0,0);
  } catch(e){ alert('خطأ في الحفظ: '+e.message); }
}

// --- Render orders ---
function stL(s){ const m={pending:'b-pending',confirmed:'b-confirmed',shipped:'b-shipped',delivered:'b-delivered'}; const t={pending:'انتظار',confirmed:'مؤكدة',shipped:'مشحونة',delivered:'مسلمة'}; return '<span class="badge '+( m[s]||'b-pending')+'">'+( t[s]||s)+'</span>'; }

window.renderOrders = function(){
  const q=(document.getElementById('o-search')?.value||'').toLowerCase();
  const sf=document.getElementById('o-filter')?.value||'';
  const fl=orders.filter(o=>(!q||(o.customer?.name||'').toLowerCase().includes(q))&&(!sf||o.status===sf));
  const list=document.getElementById('orders-list');
  if(!fl.length){list.innerHTML='<div class="empty"><i class="ti ti-shopping-bag"></i>لا توجد طلبيات</div>';updateStats();return;}
  list.innerHTML=fl.map(o=>`<div class="order-card"><div style="display:flex;align-items:center;justify-content:space-between"><div style="flex:1;min-width:0"><div class="order-name">${o.customer?.name||'-'}</div><div class="order-meta">${o.date||''} - ${o.customer?.location||''}</div>${(o.brand||o.product)?'<div style="font-size:11px;color:var(--text-muted);margin-top:2px">'+(o.brand?'<span style="color:var(--gold-dark)">'+o.brand+'</span>'+(o.product?' — ':''):'')+(o.product||'')+(o.qty&&o.qty>1?' <span style="color:var(--gold);font-weight:600">x'+o.qty+'</span>':'')+'</div>':''} ${stL(o.status)}</div><div style="text-align:right;flex-shrink:0;padding-right:4px"><div class="order-price">${o.priceIQD?Math.round(o.priceIQD).toLocaleString('en-US'):''}</div><div style="font-size:10px;color:var(--text-muted)">IQD</div><div style="font-size:11px;color:var(--text-muted)">${o.priceTL||''}TL</div><button onclick="delOrder('${o._id}')" style="background:none;border:none;color:rgba(201,168,76,0.3);font-size:16px;cursor:pointer;margin-top:4px"><i class="ti ti-trash"></i></button></div></div></div>`).join('');
  updateStats();
}

function updateStats(){
  const tot=orders.length; const pend=orders.filter(o=>o.status==='pending').length;
  const tIQD=orders.reduce((s,o)=>s+(o.priceIQD||0),0); const tTL=orders.reduce((s,o)=>s+(o.priceTL||0),0);
  document.getElementById('stats').innerHTML=`<div class="stat"><div class="stat-label">اجمالي الطلبيات</div><div class="stat-val">${tot}</div></div><div class="stat"><div class="stat-label">قيد الانتظار</div><div class="stat-val">${pend}</div></div><div class="stat"><div class="stat-label">مبيعات IQD</div><div class="stat-val" style="font-size:13px">${Math.round(tIQD).toLocaleString('en-US')}</div></div><div class="stat"><div class="stat-label">مبيعات TL</div><div class="stat-val">${Math.round(tTL).toLocaleString('en-US')}</div></div>`;
}

window.exportXL = function(){

  const ws=XLSX.utils.json_to_sheet(rows); const wb=XLSX.utils.book_new();

}

// --- Import customers ---
window.importXL = function(inp){
  const f=inp.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'}); let all=[];
      wb.SheetNames.forEach(sn=>{ const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:''}); rows.forEach(row=>{ const keys=Object.keys(row); const nk=keys.find(k=>k.includes('اسم')||k.toLowerCase().includes('name')); const ik=keys.find(k=>k.includes('انستقرام')||k.toLowerCase().includes('ig')||k.toLowerCase().includes('instagram')); const pk=keys.find(k=>k.includes('هاتف')||k.toLowerCase().includes('phone')); const lk=keys.find(k=>k.includes('مكان')||k.toLowerCase().includes('location')); if(nk&&String(row[nk]).trim())all.push({name:String(row[nk]||'').trim(),ig:String(row[ik]||'').trim(),phone:String(row[pk]||'').trim(),location:String(row[lk]||'').trim()}); }); });
      const before=customers.length; all.forEach(nc=>{if(!customers.find(c=>c.name===nc.name&&c.phone===nc.phone))customers.push(nc);}); localStorage.setItem('de_c',JSON.stringify(customers)); renderCustomers(); alert('تم استيراد '+(customers.length-before)+' عميل جديد');
    }catch(err){alert('خطأ: '+err.message);}
  }; reader.readAsBinaryString(f);
}
